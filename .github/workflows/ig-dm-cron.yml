name: IG Comment-to-DM Poll

on:
  # 2026-08-21: worker also has a native Cloudflare cron trigger now
  # (*/5 * * * *). Kept BOTH intentionally — Cloudflare's own community has
  # documented cases of Cron Triggers silently dying with no recovery even
  # after redeploy, while GitHub's schedule only drifts/delays, it doesn't
  # vanish. Each failure mode is the other's backup. Overlapping runs are
  # safe: runOnce()'s D1 claims are atomic (INSERT...ON CONFLICT...WHERE),
  # so a double-trigger just means one run wins the claim and the other
  # no-ops, never a double-send.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ig-dm-cron
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Trigger IG DM worker
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://hmw-ig-dm.howmindswork.workers.dev/run" \
            -H "Authorization: Bearer ${{ secrets.IG_DM_RUN_SECRET }}" \
            -H "Content-Type: application/json")
          BODY=$(echo "$RESPONSE" | head -1)
          CODE=$(echo "$RESPONSE" | tail -1)
          echo "Status: $CODE"
          echo "Response: $BODY"
          if [ "$CODE" != "200" ]; then
            echo "Error: worker returned $CODE"
            exit 1
          fi
