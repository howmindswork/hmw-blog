name: Blog Publisher

on:
  schedule:
    - cron: '0 14 * * *'   # 10am ET — once daily
  workflow_dispatch:

concurrency:
  group: blog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # continue-on-error intentionally removed. failures must surface.

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Generate and publish post
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_NEW_1: ${{ secrets.GROQ_API_KEY_NEW_1 }}
          GROQ_API_KEY_NEW_2: ${{ secrets.GROQ_API_KEY_NEW_2 }}
          GROQ_API_KEY_NEW_3: ${{ secrets.GROQ_API_KEY_NEW_3 }}
          GROQ_API_KEY_NEW_4: ${{ secrets.GROQ_API_KEY_NEW_4 }}
          GROQ_API_KEY_NEW_5: ${{ secrets.GROQ_API_KEY_NEW_5 }}
          GROQ_API_KEY_NEW_6: ${{ secrets.GROQ_API_KEY_NEW_6 }}
          GROQ_API_KEY_NEW_7: ${{ secrets.GROQ_API_KEY_NEW_7 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BLOG: ${{ secrets.GEMINI_API_KEY_BLOG }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/generate_post.py

      - name: Verify post was generated
        run: |
          if git diff --quiet HEAD; then
            echo "ERROR: No new post was generated. All LLM providers may be exhausted or keys expired." >&2
            exit 1
          fi

      - name: Check if new post was created
        id: check
        run: |
          if git diff --quiet HEAD; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy blog --project-name=hmw-blog --commit-dirty=true

      - name: Commit updated files
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.email "blog-bot@howmindswork.org"
          git config user.name "Blog Bot"
          git add scripts/keywords.json blog/sitemap.xml blog/posts/ blog/index.html
          git diff --staged --quiet || git commit -m "chore: publish new post + update sitemap [skip ci]"
          git pull --rebase origin main && git push
